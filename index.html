<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="브롤 카운터">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>브롤 카운터 파인더</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f5f7;color:#111827}
.app{max-width:720px;margin:auto;padding:20px 16px 40px}.top{padding-top:env(safe-area-inset-top)}
h1{font-size:25px;margin:4px 0 5px}.sub{color:#6b7280;font-size:14px;margin-bottom:18px}
.search{width:100%;padding:14px 16px;border:1px solid #d1d5db;border-radius:14px;font-size:16px;background:white;outline:none}
.search:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}
.selected{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.chip{border:0;border-radius:999px;padding:8px 11px;background:#111827;color:white;font-size:13px}
.list{display:flex;flex-wrap:wrap;gap:7px;max-height:230px;overflow:auto;padding:2px 0 8px}
.btn{border:1px solid #d1d5db;background:white;border-radius:11px;padding:9px 11px;font-size:14px}
.btn.on{background:#111827;color:white;border-color:#111827}
.card{background:white;border-radius:17px;padding:16px;margin-top:14px;box-shadow:0 2px 12px #0000000b}
.card h2{font-size:17px;margin:0 0 10px}.empty{color:#9ca3af;font-size:14px}
.counter{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.counter:last-child{border-bottom:0}.name{font-weight:600}.badge{font-size:12px;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 8px}
.common{background:#fff7ed}.common .badge{background:#ffedd5;color:#9a3412}
.help{font-size:12px;color:#6b7280;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="app top">
<h1>🎮 브롤 카운터 파인더</h1>
<div class="sub">상대 브롤러를 선택하면 카운터와 공통 카운터를 보여줘.</div>
<input id="search" class="search" placeholder="브롤러 검색..." autocomplete="off">
<div id="selected" class="selected"></div>
<div id="list" class="list"></div>
<div id="result"></div>
<div class="help">상대가 이미 선택한 브롤러는 추천 카운터에서 자동 제외돼.</div>
</div>

"찰리": "앰버,자넷,루미,지기,주주", "미코": "R-T,프랭크,불,더그,팽,스튜", "멜로디": "앰버,코델리우스,버스터,크로우,벨(장전금지)", "릴리": "코델리우스,불,R-T,드라코,트렁크", "클랜시": "찰리,타라,비,바이런,주주,래리&로리,페니", "모": "스튜,체스터,러프스,지지,모티스,미플", "주주": "모티스,에드거,발리,다이너", "올리": "포코,코델리우스,버스터,에드거,찰리,콜레트", "핑크스": "크로우,지기,팸,미플,엠즈,찰리", "루미": "모티스,에드거,릴리,크로우,브록", "재용": "크로우,보니,벨,바이런,메그", "알리": "불,트렁크,더그,프랭크,체스터,애쉬", "미나": "크로우,찰리,미플,코델리우스,트렁크", "지기": "에드거,모티스 등 모든 암살자,틱", "지지": "팽,행크,불,프랭크,더그,서지", "글로이": "크로우,벨,켄지,주주,찰리", "나지아": "모티스,비비,에드거,포코,더그,러프스", "데미안": "엠즈,니타,루,쉐이드,시리우스,에드거", "스타노바": "펄,크로우,그리프,애쉬,에드거,오티스", "웬디": "애쉬 등 모든탱커,에드거,팸,베리", "코스모": "", "빈스": "", "스파이크": "발리,지기,주주 등 모든 스로어,칼,벨", "크로우": "롤라,러프스,펄,미플,8비트,바이런", "레온": "크로우,자넷,진,미나,찰리,러프스,체스터", "샌디": "니타,드라코,엠즈,켄지,발리,주주", "앰버": "바이런,스튜,모티스,롤라,에드거", "메그": "롤라,비,콜레트,크로우,피어스", "서지": "찰리,러프스,타라,스튜,그리프", "체스터": "찰리,스튜,타라,러프스,루미,미나,엠즈", "코델리우스": "프랭크,스튜,샌디,서지,게일", "키트": "프랭크,릴리,코델리우스,행크,더그,재키", "드라코": "프랭크,코델리우스,크로우,애쉬,루", "켄지": "드라코,프랭크,그리프,핑크스,애쉬", "피어스": "찰리,미나,러프스,나니,스파이크", "노리": "재키,더그,서지,팽,스튜,그리프", "카제": "타라,체스터,크로우,켄지,샌디,핑크스", "시리우스": "에드거,발리,켄지,페니,루미"};
const generic = {"모든 암살자": ["모티스", "에드거", "릴리", "미코", "팽", "버즈", "레온", "미나", "쉐이드", "켄지"], "모든 스로어": ["발리", "다이너마이크", "틱", "그롬", "윌로우", "스프라우트", "래리&로리", "주주"], "모든 탱커": ["불", "엘프리모", "로사", "프랭크", "애쉬", "행크", "재키", "트렁크", "드라코", "버스터"]};
const names = Object.keys(raw);
let selected = [];

function candidates(name){
  const text = raw[name] || "";
  if(!text) return [];
  return text.split(",").flatMap(x=>{
    let t=x.trim();
    const m=t.match(/^(.+?)\s*등 모든(암살자|스로어|탱커)$/);
    if(m) return [m[1], ...(generic["모든 "+m[2]]||[])];
    // Preserve conditional entries as their visible base name for counting.
    if(t.includes("(")) return [t.split("(")[0].trim()];
    if(t.includes("등 저격수")) {
      const base=t.replace(/\s*등 저격수/,"").trim();
      return [base]; // only explicit Belle/Piper-like named counter is used
    }
    if(t.includes("모든탱커")) {
      return generic["모든 탱커"];
    }
    return t ? [t] : [];
  });
}

function render(){
  const q=document.getElementById("search").value.trim();
  const list=document.getElementById("list");
  const filtered=names.filter(n=>n.includes(q));
  list.innerHTML=filtered.map(n=>`<button class="btn ${selected.includes(n)?"on":""}" onclick="toggle('${n.replace(/'/g,"\\\\'")}')">${n}</button>`).join("");
  document.getElementById("selected").innerHTML=selected.map(n=>`<button class="chip" onclick="toggle('${n.replace(/'/g,"\\\\'")}')">${n} ×</button>`).join("");

  const result=document.getElementById("result");
  if(!selected.length){ result.innerHTML='<div class="card empty">상대 브롤러를 선택해줘.</div>'; return; }

  let counts={};
  selected.forEach(s=>candidates(s).forEach(c=>{counts[c]=(counts[c]||0)+1;}));
  selected.forEach(s=>delete counts[s]);

  const arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko"));
  const full=arr.filter(x=>x[1]===selected.length);
  const partial=arr.filter(x=>x[1]<selected.length);

  let html="";
  if(full.length){
    html+=`<div class="card common"><h2>🔥 공통 카운터</h2>${full.map(([n,c])=>row(n,c)).join("")}</div>`;
  }
  html+=`<div class="card"><h2>추천 카운터</h2>${(full.concat(partial)).length ? full.concat(partial).map(([n,c])=>row(n,c)).join("") : '<div class="empty">등록된 공통 카운터가 없어.</div>'}</div>`;
  selected.forEach(s=>{
    const cs=candidates(s).filter(x=>!selected.includes(x));
    html+=`<div class="card"><h2>${s} 카운터</h2>${cs.length?cs.map(x=>row(x,1)).join(""):'<div class="empty">등록된 카운터 없음</div>'}</div>`;
  });
  result.innerHTML=html;
}
function row(n,c){return `<div class="counter"><span class="name">${n}</span><span class="badge">${c}/${selected.length}</span></div>`}
function toggle(n){
  selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];
  render();
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
